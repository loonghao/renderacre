name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish built artifacts to PyPI"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build binaries (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
            archive: tar.gz
          - os: macos-15-intel
            asset_suffix: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            asset_suffix: macos-arm64
            archive: tar.gz
          - os: windows-latest
            asset_suffix: windows-x86_64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build controller and worker
        run: cargo build --release -p renderacre-controller -p renderacre-worker --locked

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle="renderacre-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}"
          mkdir -p "dist-bin/${bundle}"
          cp "target/release/renderacre-controller" "dist-bin/${bundle}/"
          cp "target/release/renderacre-worker" "dist-bin/${bundle}/"
          cp README.md LICENSE LICENSE-APACHE LICENSE-MIT "dist-bin/${bundle}/"
          tar -C dist-bin -czf "dist-bin/${bundle}.tar.gz" "${bundle}"
          rm -rf "dist-bin/${bundle}"

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "renderacre-$env:GITHUB_REF_NAME-${{ matrix.asset_suffix }}"
          New-Item -ItemType Directory -Force -Path "dist-bin\$bundle" | Out-Null
          Copy-Item "target\release\renderacre-controller.exe" "dist-bin\$bundle\"
          Copy-Item "target\release\renderacre-worker.exe" "dist-bin\$bundle\"
          Copy-Item README.md,LICENSE,LICENSE-APACHE,LICENSE-MIT "dist-bin\$bundle\"
          Compress-Archive -Path "dist-bin\$bundle" -DestinationPath "dist-bin\$bundle.zip" -Force
          Remove-Item -Recurse -Force "dist-bin\$bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: renderacre-bin-${{ matrix.asset_suffix }}
          path: dist-bin/*

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: "2014"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_pypi == 'true'
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-github-release:
    name: Publish GitHub Release assets
    needs: [build-binaries, build-wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
