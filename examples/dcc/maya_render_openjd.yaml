specificationVersion: jobtemplate-2023-09
name: MayaRender
parameterDefinitions:
  - name: MayaPython
    type: STRING
    default: mayapy
  - name: ScriptPath
    type: PATH
  - name: OutputDir
    type: PATH
steps:
  - name: RenderFrame
    parameterSpace:
      taskParameterDefinitions:
        - name: Frame
          type: INT
          range: "1-3"
    script:
      actions:
        onRun:
          command: "{{ Param.MayaPython }}"
          args:
            - "{{ Param.ScriptPath }}"
            - --frame
            - "{{ Task.Param.Frame }}"
            - --output-dir
            - "{{ Param.OutputDir }}"
