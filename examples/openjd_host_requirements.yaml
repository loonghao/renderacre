specificationVersion: jobtemplate-2023-09
name: OpenJDHostRequirements
description: OpenJD routing demo that requires a Linux worker with at least two vCPU slots.
steps:
  - name: LinuxOnly
    hostRequirements:
      amounts:
        - name: amount.worker.vcpu
          min: 2
      attributes:
        - name: attr.worker.os.family
          anyOf: [linux]
    script:
      actions:
        onRun:
          command: python
          args:
            - -c
            - "print('running on an OpenJD-capable Renderacre worker')"
