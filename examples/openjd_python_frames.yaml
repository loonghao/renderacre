specificationVersion: jobtemplate-2023-09
name: PythonFrameSmoke
parameterDefinitions:
  - name: PythonExecutable
    type: STRING
    default: python
  - name: Message
    type: STRING
    default: renderacre
steps:
  - name: Frame
    parameterSpace:
      taskParameterDefinitions:
        - name: Frame
          type: INT
          range: "1-5"
    script:
      actions:
        onRun:
          command: "{{ Param.PythonExecutable }}"
          args:
            - -c
            - "print('{{ Param.Message }} frame {{ Task.Param.Frame }}')"
